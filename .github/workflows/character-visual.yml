name: Character visual QA
on:
  push:
    branches: [main]
    paths:
      - 'assets/illustrations/**'
      - 'app.js'
      - 'v07.css'
      - '.github/workflows/character-visual.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/character.test.mjs
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Render ten actual illustrations
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          ids=['outfit-charcoal','outfit-cream','outfit-mist','outfit-white','outfit-rose','outfit-sage','mood-sleepy','mood-happy','mood-calm','mood-cheer']
          sheet=Image.new('RGB',(5*220,2*255),'#f5f7fb')
          d=ImageDraw.Draw(sheet)
          for i,name in enumerate(ids):
              img=Image.open('assets/illustrations/'+name+'.webp').convert('RGB').resize((208,208))
              x=(i%5)*220+6;y=(i//5)*255+6
              sheet.paste(img,(x,y));d.text((x,y+215),name,fill='#40516b')
          sheet.save('illustrations-contact-sheet.png')
          print('PASS: 10 actual illustrations rendered')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eli-v07-illustrations
          path: illustrations-contact-sheet.png
