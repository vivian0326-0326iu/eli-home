name: Mobile UI smoke test
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'v07.css'
      - 'assets/illustrations/**'
      - 'tests/illustration-ui.mjs'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test real mobile interaction
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/eli-server.log 2>&1 &
          node tests/illustration-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eli-mobile-v07
          path: test-results/
