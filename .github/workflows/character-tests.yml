name: Character regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check character-v06.js
          node --check sw.js
      - name: Character combinations
        run: node tests/character.test.mjs
      - name: Validate SVG XML
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          with open('character-fixtures.json') as f: items=json.load(f)
          for i,svg in enumerate(items):
              root=ET.fromstring(svg)
              assert root.tag=='{http://www.w3.org/2000/svg}svg', i
          print(f'PASS: {len(items)} valid SVG illustrations')
          PY
