<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>eli · 插画预览</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#edf2f8;color:#40516b;margin:0;padding:18px}main{max-width:950px;margin:auto}h1{font-size:23px}p{line-height:1.8;color:#68798d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:white;padding:10px;border-radius:17px;text-align:center}.tile img{width:100%;max-width:240px;aspect-ratio:1.1;object-fit:cover;border-radius:12px}.tile span{display:block;padding:7px 0}@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><a href="./">← 返回小家</a><h1>eli 的插画衣柜 · V0.7</h1><p>这里是网站实际使用的 6 张服装图与 4 张情绪图；两套图片分别切换，目前还不是 24 张合成立绘。</p><h2>服装（6 张）</h2><div class="grid"><div class="tile"><img src="assets/illustrations/outfit-charcoal.webp" alt="炭灰卫衣" loading="lazy"><span>炭灰卫衣</span></div><div class="tile"><img src="assets/illustrations/outfit-cream.webp" alt="奶油毛衣" loading="lazy"><span>奶油毛衣</span></div><div class="tile"><img src="assets/illustrations/outfit-mist.webp" alt="雾蓝外套" loading="lazy"><span>雾蓝外套</span></div><div class="tile"><img src="assets/illustrations/outfit-white.webp" alt="白色衬衫" loading="lazy"><span>白色衬衫</span></div><div class="tile"><img src="assets/illustrations/outfit-rose.webp" alt="针织开衫" loading="lazy"><span>针织开衫</span></div><div class="tile"><img src="assets/illustrations/outfit-sage.webp" alt="休闲针织" loading="lazy"><span>休闲针织</span></div></div><h2>情绪（4 张）</h2><div class="grid"><div class="tile"><img src="assets/illustrations/mood-sleepy.webp" alt="困困" loading="lazy"><span>困困</span></div><div class="tile"><img src="assets/illustrations/mood-happy.webp" alt="开心" loading="lazy"><span>开心</span></div><div class="tile"><img src="assets/illustrations/mood-calm.webp" alt="安静" loading="lazy"><span>安静</span></div><div class="tile"><img src="assets/illustrations/mood-cheer.webp" alt="打气" loading="lazy"><span>打气</span></div></div></main></body></html>
